<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mrs. Girshovich - 4th Grade Class Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1b264f;
      --gold: #f2c94c;
      --gold-dark: #d4a317;
      --pencil-yellow: #ffd166;
      --apple-red: #ef476f;
      --green-bg: #e8f5e9;
      --green-border: #2e7d32;
      --orange-bg: #fff3e0;
      --orange-border: #e65100;
      --sky-blue: #e0f2fe;
      --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #dbe3ed 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      background: white;
      border-top: 8px solid var(--pencil-yellow);
      border-bottom: 5px solid var(--navy);
      border-radius: 20px;
      padding: 18px 24px;
      text-align: center;
      max-width: 1250px;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 25px rgba(27, 38, 79, 0.1);
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .weather-widget {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      color: var(--navy);
      font-size: 1.15rem;
      background: var(--sky-blue);
      border: 2px solid #bae6fd;
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .date-widget {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      color: var(--navy);
      background: #f1f5f9;
      padding: 8px 18px;
      border-radius: 12px;
    }

    .fullscreen-btn {
      background: var(--navy);
      color: var(--gold);
      border: 2px solid var(--gold);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .fullscreen-btn:hover { transform: scale(1.05); }

    .logo-container { margin-bottom: 5px; }
    .logo-svg { max-height: 100px; width: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }

    h1.class-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      margin: 8px 0;
      color: var(--navy);
      letter-spacing: 0.5px;
    }

    .lunch-summary-banner {
      background: var(--orange-bg);
      border: 3px dashed var(--orange-border);
      border-radius: 14px;
      padding: 12px 18px;
      margin: 12px 0 0 0;
      color: var(--orange-border);
      font-weight: 800;
      font-size: 1.15rem;
    }

    .board-container {
      display: grid;
      grid-template-columns: 1fr 1fr 310px;
      gap: 20px;
      max-width: 1250px;
      margin: 0 auto;
    }

    .column {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 2px solid #e2e8f0;
      min-height: 420px;
    }

    .column h2 {
      font-family: 'Fredoka', sans-serif;
      text-align: center;
      color: white;
      background: var(--navy);
      margin: -18px -18px 18px -18px;
      padding: 14px;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      font-size: 1.3rem;
      border-bottom: 4px solid var(--gold);
      letter-spacing: 0.5px;
    }

    .student-list { display: flex; flex-direction: column; gap: 10px; }

    .student-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: white;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
      box-shadow: 0 3px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .student-info { display: flex; align-items: center; gap: 10px; }

    .check-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 8px;
      font-weight: 700;
    }

    .check-group.here { background: #eef7ee; border: 1.5px solid var(--green-border); color: var(--green-border); }
    .check-group.lunch { background: var(--orange-bg); border: 1.5px solid var(--orange-border); color: var(--orange-border); }
    .check-group input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--navy); }

    .signed-in { background-color: var(--green-bg); border-color: var(--green-border); }

    .star-control {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #fef9c3;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--gold-dark);
      font-family: 'Fredoka', sans-serif;
    }

    .star-btn {
      background: var(--gold);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 26px;
      height: 26px;
      font-size: 1.1rem;
      color: var(--navy);
      transition: transform 0.1s;
    }
    .star-btn:active { transform: scale(0.9); }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #f8fafc;
      border-left: 4px solid var(--navy);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .timer-display {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--navy);
      margin: 10px 0;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 12px;
      border: 2px inset #cbd5e1;
    }

    .timer-buttons { display: flex; gap: 6px; justify-content: center; }
    .timer-buttons button {
      font-family: 'Fredoka', sans-serif;
      background: var(--navy);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(27, 38, 79, 0.65);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
      z-index: 1000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: white; padding: 35px; border-radius: 24px;
      text-align: center; border: 6px solid var(--gold);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="weather-widget" id="weather">🌤️ Rock Hill: Fetching...</div>
      <div class="date-widget" id="current-date">📅 Loading Date...</div>
      <button class="fullscreen-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">⛶</button>
    </div>

    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="150" cy="150" r="135" fill="none" stroke="#1b264f" stroke-width="22"/>
        <circle cx="150" cy="150" r="146" fill="none" stroke="#1b264f" stroke-width="2"/>
        <circle cx="150" cy="150" r="123" fill="none" stroke="#1b264f" stroke-width="2"/>
        <path id="arcTop" d="M 40,150 A 110,110 0 0,1 260,150" fill="none"/>
        <text font-family="'Times New Roman', serif" font-weight="bold" font-size="20" fill="#ffffff" letter-spacing="2">
          <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SAINT ANNE</textPath>
        </text>
        <path id="arcBottom" d="M 260,150 A 110,110 0 0,1 40,150" fill="none"/>
        <text font-family="'Times New Roman', serif" font-weight="bold" font-size="18" fill="#ffffff" letter-spacing="2">
          <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">CATHOLIC SCHOOL</textPath>
        </text>
        <path d="M 100,95 L 200,95 L 200,155 C 200,195 150,225 150,225 C 150,225 100,195 100,155 Z" fill="#ffffff" stroke="#1b264f" stroke-width="3"/>
        <path d="M 144,95 L 156,95 L 156,222 L 144,222 Z" fill="#1b264f"/>
        <path d="M 100,144 L 200,144 L 200,156 L 100,156 Z" fill="#1b264f"/>
        <path d="M 118,105 C 118,122 132,125 132,125 L 132,132 L 122,132 L 122,135 L 138,135 L 138,132 L 128,132 L 128,125 C 128,125 142,122 142,105 Z" fill="#1b264f"/>
        <path d="M 165,120 Q 170,115 185,115 L 190,120 Q 180,126 172,126 L 172,129 L 180,129 L 180,132 L 165,132 L 165,129 L 169,129 L 169,126 Q 160,125 165,120 Z" fill="#1b264f"/>
        <path d="M 112,175 Q 110,165 115,160 Q 118,168 120,175 Z" fill="#1b264f"/>
        <line x1="110" y1="198" x2="138" y2="165" stroke="#1b264f" stroke-width="2"/>
        <path d="M 122,185 Q 127,183 132,185 Q 137,183 142,185 L 142,193 Q 137,191 132,193 Q 127,191 122,193 Z" fill="none" stroke="#1b264f" stroke-width="1.5"/>
        <path d="M 175,160 Q 165,175 175,195 Q 185,175 175,160 Z" fill="none" stroke="#1b264f" stroke-width="2"/>
        <path d="M 175,168 Q 170,178 175,190 Q 180,178 175,168 Z" fill="#1b264f"/>
        <path d="M 150,72 C 145,80 142,83 136,79 C 142,90 150,92 150,92 C 150,92 158,90 164,79 C 158,83 155,80 150,72 Z" fill="#1b264f" stroke="#1b264f" stroke-width="1"/>
        <line x1="138" y1="88" x2="162" y2="88" stroke="#1b264f" stroke-width="2"/>
        <path d="M 125,228 Q 150,233 175,228 Q 170,238 150,238 Q 130,238 125,228 Z" fill="#ffffff" stroke="#1b264f" stroke-width="1.5"/>
        <text x="150" y="235" font-family="'Times New Roman', serif" font-size="10" fill="#1b264f" text-anchor="middle" font-weight="bold">1951</text>
      </svg>
    </div>

    <h1 class="class-title">✏️ Mrs. Girshovich's 4th Grade Class 📚</h1>
    
    <div class="lunch-summary-banner">
       🍱 Hot Lunches Selected: <span id="lunch-count">0</span>
      <div id="lunch-names" style="font-size: 0.95rem; font-weight: 600; margin-top: 4px;">None yet</div>
    </div>
  </header>

  <div class="board-container">
    <div class="column">
      <h2>🎒 Not Here Yet</h2>
      <div id="absent-list" class="student-list"></div>
    </div>

    <div class="column">
      <h2>🌟 Signed In</h2>
      <div id="present-list" class="student-list"></div>
    </div>

    <div class="column">
      <h2>🛠️ Classroom Tools</h2>
      
      <h3 style="margin-top:0; color:var(--navy); font-family:'Fredoka', sans-serif;">⏱️ Quick Timer</h3>
      <div class="timer-display" id="timer-display">00:00</div>
      <div class="timer-buttons">
        <button onclick="setTimer(60)">1m</button>
        <button onclick="setTimer(300)">5m</button>
        <button onclick="setTimer(600)">10m</button>
        <button onclick="stopTimer()" style="background:var(--apple-red);">Stop</button>
      </div>

      <h3 style="color:var(--navy); margin-top: 25px; font-family:'Fredoka', sans-serif;">📅 Daily Schedule</h3>
      <div id="schedule-list">Loading schedule...</div>
    </div>
  </div>

  <div id="welcome-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="greeting-text" style="color: var(--navy); margin: 0; font-family:'Fredoka', sans-serif; font-size: 2rem;">Welcome!</h2>
      <p id="student-name-text" style="color: var(--green-border); font-size: 1.8rem; font-weight: 800; margin: 10px 0 0 0;"></p>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwuXSkeqo34KsvXbslnYc8F1e7egUbHyj651LgCbeFGTdIucTnfWOg_wx7YtSVuHInc/exec";

    const studentNames = [
      "Samuel Bell", "Liliana Cieslak", "Charlotte Eiden", "Jude Jambon",
      "Brynn Kirksey", "Graham Lozier", "Samuel Ratchford", "Sydney Stout",
      "Jasper Verdin", "Mia Weaver"
    ];

    let studentStars = {};
    let timerInterval = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTripleDing() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const playSingleDing = (delay) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }, delay);
      };
      playSingleDing(0); playSingleDing(250); playSingleDing(500);
    }

    async function getWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=34.9249&longitude=-81.0251&current_weather=true&temperature_unit=fahrenheit");
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          let icon = "☀️";
          if (code > 0 && code <= 3) icon = "⛅";
          else if (code >= 45 && code <= 67) icon = "🌧️";
          else if (code >= 71) icon = "❄️";

          document.getElementById('weather').textContent = `${icon} Rock Hill: ${temp}°F`;
        }
      } catch(e) {
        document.getElementById('weather').textContent = "☀️ Rock Hill, SC";
      }
    }

    function formatTime(rawTime) {
      if (!rawTime) return "";
      if (typeof rawTime === 'string' && rawTime.includes('T')) {
        const dateObj = new Date(rawTime);
        return dateObj.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }
      return rawTime;
    }

    async function fetchSheetData() {
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const data = await res.json();
        
        const schedContainer = document.getElementById('schedule-list');
        schedContainer.innerHTML = '';
        if (data.schedule && data.schedule.length > 0) {
          data.schedule.forEach(item => {
            const cleanTime = formatTime(item.time);
            schedContainer.innerHTML += `
              <div class="schedule-item">
                <span style="font-weight:800; color:var(--navy);">${cleanTime}</span>
                <strong style="color:#334155;">${item.subject}</strong>
              </div>`;
          });
        } else {
          schedContainer.innerHTML = '<div>No schedule posted.</div>';
        }

        if (data.stars) {
          studentStars = data.stars;
          updateStarDisplays();
        }
      } catch(e) {
        document.getElementById('schedule-list').innerHTML = '<div>Schedule offline</div>';
      }
    }

    function initList() {
      document.getElementById('current-date').textContent = "📅 " + new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      
      const absentContainer = document.getElementById('absent-list');
      absentContainer.innerHTML = '';
      document.getElementById('present-list').innerHTML = '';

      studentNames.forEach((fullName, index) => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.id = `student-${index}`;
        const firstName = fullName.split(' ')[0];

        card.innerHTML = `
          <div class="student-info">
            <span>${fullName}</span>
          </div>
          <div style="display:flex; gap: 6px; align-items:center;">
            <div class="check-group here">
              <input type="checkbox" id="chk-here-${index}" onchange="handleSignIn(${index}, '${firstName}', '${fullName}')">
              <label for="chk-here-${index}">Here</label>
            </div>
            <div class="check-group lunch">
              <input type="checkbox" id="chk-lunch-${index}" onchange="updateLunchSummary()">
              <label for="chk-lunch-${index}">Lunch</label>
            </div>
            <div class="star-control">
              <span style="color:var(--gold-dark);">★</span>
              <span id="star-count-${index}">0</span>
              <button class="star-btn" onclick="addStar('${fullName}', ${index})">+</button>
            </div>
          </div>
        `;
        absentContainer.appendChild(card);
      });

      getWeather();
      fetchSheetData();
    }

    function handleSignIn(index, firstName, fullName) {
      const card = document.getElementById(`student-${index}`);
      const chkHere = document.getElementById(`chk-here-${index}`);
      const chkLunch = document.getElementById(`chk-lunch-${index}`);
      const presentContainer = document.getElementById('present-list');
      const absentContainer = document.getElementById('absent-list');

      if (chkHere.checked) {
        card.classList.add('signed-in');
        presentContainer.appendChild(card);
        showPopup("Good morning", firstName);

        fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateAttendance', studentName: fullName, isPresent: true, isHotLunch: chkLunch.checked })
        }).catch(err => console.error(err));
      } else {
        card.classList.remove('signed-in');
        absentContainer.appendChild(card);
      }
    }

    function updateLunchSummary() {
      const lunchNames = [];
      studentNames.forEach((name, idx) => {
        const chkLunch = document.getElementById(`chk-lunch-${idx}`);
        if (chkLunch && chkLunch.checked) lunchNames.push(name.split(' ')[0]);
      });
      document.getElementById('lunch-count').textContent = lunchNames.length;
      document.getElementById('lunch-names').textContent = lunchNames.length > 0 ? lunchNames.join(', ') : 'None yet';
    }

    function addStar(studentName, index) {
      const current = (studentStars[studentName] || 0) + 1;
      studentStars[studentName] = current;
      document.getElementById(`star-count-${index}`).textContent = current;

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateStars', studentName: studentName, starCount: current })
      }).catch(err => console.error(err));
    }

    function updateStarDisplays() {
      studentNames.forEach((name, idx) => {
        const elem = document.getElementById(`star-count-${idx}`);
        if (elem && studentStars[name] !== undefined) {
          elem.textContent = studentStars[name];
        }
      });
    }

    function setTimer(seconds) {
      clearInterval(timerInterval);
      let remaining = seconds;
      const display = document.getElementById('timer-display');
      
      const updateDisplay = () => {
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        display.textContent = `${m}:${s}`;
      };

      updateDisplay();

      timerInterval = setInterval(() => {
        remaining--;
        if (remaining < 0) {
          clearInterval(timerInterval);
          display.textContent = "🔔 TIME!";
          playTripleDing();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-display').textContent = "00:00";
    }

    function showPopup(greeting, name) {
      const modal = document.getElementById('welcome-modal');
      document.getElementById('greeting-text').textContent = `${greeting}! 🎒`;
      document.getElementById('student-name-text').textContent = name;
      modal.classList.add('active');
      setTimeout(() => modal.classList.remove('active'), 1500);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    }

    window.addEventListener('DOMContentLoaded', initList);
  </script>
</body>
</html>
